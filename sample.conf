[General]
# Write every step to the log, not only warnings and errors.
Debug = false

# The name Moonlight shows for this machine. "auto" uses the computer name.
HostName = auto

# Prefer a virtual display driver over a real screen, when one is found. This server never
# installs one itself; the installer's own checkbox does, if you asked it to.
VirtualDisplay = false

[Display]
# Which screen to stream: "auto" for the one attached to the desktop, a screen's own
# number (shown in the log at startup) or a piece of its name for another.
Output = auto

[Network]
# First port of the block Moonlight expects. Every other port is derived from it.
PortBase = 47989

# Address to listen on. "any" accepts connections on every interface.
BindAddress = any

# The page that shows what this server is doing and pairs a client. Local network only.
WebPort = 80

# Ask the router, over UPnP, to forward the streaming ports from the internet.
Upnp = false

# While the ports above are forwarded, an address outside this network that fails to pair
# this many times is refused for the minutes below, to ban untrusted IP addresses.
BlockAfterFailures = 5
BlockMinutes = 15

[Games]
# Which stores to look in for installed games.
Steam = true
Xbox = true
Epic = false
Gog = false
Ea = false
BattleNet = true

# Folders of your own, separated by commas; a name with a comma goes in quotes or brackets:
#     Folders = D:\Games, "E:\Discs, old", [F:\Emulators (2004)]
Folders = 

# How many folder levels below each of those to look into. 1 is the folder itself.
Depth = 2
