name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Decide whether this is a release
        id: check
        shell: pwsh
        run: |
          $csproj = 'src/RemoteGameHub.csproj'
          $version = ([xml](Get-Content $csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          if (-not $version) { throw "No <Version> in $csproj" }
          $version = "$version".Trim()
          Write-Host "Version in the project: $version"

          $previous = git tag --list 'v[0-9]*' --sort=-v:refname | Select-Object -First 1
          Write-Host "Newest tag: $(if ($previous) { $previous } else { '(none)' })"

          $newer = $true
          if ($previous) {
            $newer = [version]$version -gt [version]($previous -replace '^v', '')
          }

          $changelog = Get-Content 'changelog.md' -Raw
          $pattern = '(?ms)^##\s+' + [regex]::Escape($version) + '\s*$(.*?)(?=^##\s|\z)'
          $match = [regex]::Match($changelog, $pattern)
          $described = $match.Success -and $match.Groups[1].Value.Trim().Length -gt 0

          Write-Host "Higher than the tag: $newer; described in changelog.md: $described"

          if (-not ($newer -and $described)) {
            $reason = if (-not $newer) { "version $version is not higher than $previous" } else { "changelog.md has no section for $version" }
            Write-Host "No release: $reason"
            "release=false" >> $env:GITHUB_OUTPUT
            "## No release`n`n$reason" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $tag = "v$version"
          $link = if ($previous) {
            "${{ github.server_url }}/${{ github.repository }}/compare/$previous...$tag"
          } else {
            "${{ github.server_url }}/${{ github.repository }}/commits/$tag"
          }

          $notes = $match.Groups[1].Value.Trim() + "`n`n**Full list of changes:** $link`n"
          Set-Content -Path 'release-notes.md' -Value $notes -Encoding utf8

          "release=true"     >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag"         >> $env:GITHUB_OUTPUT

      - name: Build the server
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        run: ./build.ps1

      # The tests have already passed in the job above, which is why neither script runs them.
      - name: Build the installer
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        run: ./installer/installer.ps1 -Version ${{ steps.check.outputs.version }}

      - name: Publish the release
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.check.outputs.tag }} `
            'build/Remote-Gamehub.msi' `
            --title '${{ steps.check.outputs.tag }}' `
            --notes-file release-notes.md `
            --target ${{ github.sha }}
