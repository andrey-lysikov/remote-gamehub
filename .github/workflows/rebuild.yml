name: Rebuild

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild. Empty means the newest release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  rebuild:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Find the release
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.inputs.tag }}'.Trim()
          if (-not $tag) { $tag = gh release view --json tagName --jq '.tagName' }
          if ($LASTEXITCODE -ne 0 -or -not $tag) { throw 'No release to rebuild.' }

          Write-Host "Rebuilding the installer of $tag from $($env:GITHUB_SHA)"

          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw "The tag $tag is not a version." }

          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build the server
        shell: pwsh
        run: ./build.ps1

      # The tests have already passed in the job above, which is why neither script runs them.
      - name: Build the installer
        shell: pwsh
        run: ./installer/installer.ps1 -Version ${{ steps.target.outputs.version }}

      - name: Replace the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.target.outputs.tag }} 'build/Remote-Gamehub.msi' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'The installer was not uploaded.' }

      - name: Point the list of commits at what was built
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.target.outputs.tag }}'
          $sha = '${{ github.sha }}'

          $body = (gh release view $tag --json body --jq '.body') -join "`n"
          $lines = $body -split "`r?`n"
          $changed = $false

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -notmatch 'Full list of changes') { continue }

            $line = [regex]::Replace($lines[$i], '(/compare/[^\s/]+\.\.\.)\S+', ('${1}' + $sha))
            $line = [regex]::Replace($line, '(/commits/)\S+', ('${1}' + $sha))

            if ($line -ne $lines[$i]) { $lines[$i] = $line; $changed = $true }
          }

          if (-not $changed) {
            Write-Host 'No link to the commits in the description — it is left as it is.'
            "## Rebuilt`n`nThe installer of $tag was replaced with a build of $sha." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          Set-Content -Path 'release-notes.md' -Value ($lines -join "`n") -Encoding utf8
          gh release edit $tag --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'The description was not updated.' }

          "## Rebuilt`n`nThe installer of $tag was replaced with a build of $sha, and the list of commits now ends there." >> $env:GITHUB_STEP_SUMMARY
