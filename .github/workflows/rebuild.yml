name: Rebuild

# Replaces the files attached to a release with ones built from the branch. Started by hand only:
# the version, tag and description stay; only the files and the link to the commits change.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild. Empty means the newest release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the description of the release links to the commits, and that link
          # is rewritten below.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Find the release
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.inputs.tag }}'.Trim()
          if (-not $tag) { $tag = gh release view --json tagName --jq '.tagName' }
          if ($LASTEXITCODE -ne 0 -or -not $tag) { throw 'No release to rebuild.' }

          Write-Host "Rebuilding the installer of $tag from $($env:GITHUB_SHA)"

          # The installer's own version must be the one on the release page, not the branch's.
          # Two numbers, as everywhere in this project; a third is tolerated.
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw "The tag $tag is not a version." }

          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        # The same script a developer runs, with the version of the release being rebuilt rather
        # than the branch's: an installer announcing another number would contradict its page.
        run: ./build.ps1 -Installer -Version ${{ steps.target.outputs.version }}

      - name: Replace the files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.target.outputs.tag }} 'build/Remote-Gamehub.msi' 'build/Remote-Gamehub.exe' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'The files were not uploaded.' }

      - name: Point the list of commits at what was built
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.target.outputs.tag }}'
          $sha = '${{ github.sha }}'

          # Only the line with the link is touched; the hand-written description is left alone.
          # gh hands the body back line by line, so it is joined and split once more (no stray CRs).
          $body = (gh release view $tag --json body --jq '.body') -join "`n"
          $lines = $body -split "`r?`n"
          $changed = $false

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -notmatch 'Full list of changes') { continue }

            $line = [regex]::Replace($lines[$i], '(/compare/[^\s/]+\.\.\.)\S+', ('${1}' + $sha))
            $line = [regex]::Replace($line, '(/commits/)\S+', ('${1}' + $sha))

            if ($line -ne $lines[$i]) { $lines[$i] = $line; $changed = $true }
          }

          if (-not $changed) {
            Write-Host 'No link to the commits in the description — it is left as it is.'
            "## Rebuilt`n`nThe files of $tag were replaced with a build of $sha." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          Set-Content -Path 'release-notes.md' -Value ($lines -join "`n") -Encoding utf8
          gh release edit $tag --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'The description was not updated.' }

          "## Rebuilt`n`nThe files of $tag were replaced with a build of $sha, and the list of commits now ends there." >> $env:GITHUB_STEP_SUMMARY
